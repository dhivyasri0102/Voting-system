version: '3.8'

services:
  # Web Application (React + Node.js Full-Stack API Gateway)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evoting-core-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://election_admin:SecureElectionPass2026!@postgres:5432/evoting_db
      - REDIS_URL=redis://:RedisSecurePass2026!@redis:6379/0
      - ELECTORAL_ROLL_ENVIRONMENT=unconfigured
      # EVM / Solidity Node Configuration
      - ETH_RPC_URL=http://hardhat-node:8545
      - VOTING_CONTRACT_ADDRESS=${VOTING_CONTRACT_ADDRESS:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
      # JWT & Admin MFA Secrets (auto-generated if empty)
      - JWT_SECRET=${JWT_SECRET:-}
      - ADMIN_MFA_SECRET=${ADMIN_MFA_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      hardhat-node:
        condition: service_started
    networks:
      - election-network

  # Relational Store for Identity & State
  postgres:
    image: postgres:15-alpine
    container_name: evoting-postgres
    restart: always
    environment:
      POSTGRES_DB: evoting_db
      POSTGRES_USER: election_admin
      POSTGRES_PASSWORD: SecureElectionPass2026!
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U election_admin -d evoting_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - election-network

  # Redis for Ephemeral State, Nonce Storage & Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: evoting-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "RedisSecurePass2026!"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "RedisSecurePass2026!", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - election-network

  # Hardhat Local EVM Blockchain Node (Solidity Smart Contract Layer)
  hardhat-node:
    image: node:20-alpine
    container_name: evoting-solidity-node
    working_dir: /app
    volumes:
      - .:/app
    command: ["npx", "hardhat", "node", "--hostname", "0.0.0.0"]
    ports:
      - "8545:8545"
    networks:
      - election-network

  # Prometheus Metrics Collector
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: evoting-prometheus
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - election-network

  # Grafana Monitoring Dashboard
  grafana:
    image: grafana/grafana:10.2.2
    container_name: evoting-grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - election-network

volumes:
  postgres_data:
  redis_data:

networks:
  election-network:
    driver: bridge
